server:
  port: 8080
  servlet:
    context-path: /
    session:
      cookie:
        http-only: true
        same-site: lax
        name: JSESSIONID

spring:
  application:
    name: crre-academic-dms

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/crre_academic_dms}
    username: ${DB_USERNAME:crre_user}
    password: ${DB_PASSWORD:crre_password123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    root: INFO
    com.crre.academicdms: DEBUG
    org.springframework.security: INFO
