server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: crre-academic-dms

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/crre_academic_dms}
    username: ${DB_USERNAME:crre_user}
    password: ${DB_PASSWORD:crre_password123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    # 256-bit+ secure secret key for HMAC-SHA256
    secret: ${JWT_SECRET:crre-academic-dms-super-secret-key-that-is-at-least-256-bits-long-2026!}
    # 24 hours in milliseconds = 86400000 ms
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    root: INFO
    com.crre.academicdms: DEBUG
    org.springframework.security: INFO
